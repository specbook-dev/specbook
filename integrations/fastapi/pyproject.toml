[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specbook-fastapi"
version = "0.1.4"
description = "Serve the Specbook API viewer from a FastAPI app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ajai Shankar" }]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.100"]
keywords = ["fastapi", "openapi", "swagger", "api-docs", "specbook", "api-documentation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Documentation",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://docs.specbook.dev"
Viewer = "https://ui.specbook.dev"
Source = "https://github.com/specbook-dev/specbook/tree/main/integrations/fastapi"
Issues = "https://github.com/specbook-dev/specbook/issues"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "mypy>=2.4.0",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/specbook_fastapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.10"
