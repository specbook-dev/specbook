# #region monitor-secrets
# the step of .github/workflows/monitor.yml that runs the bundle
- run: node specbook-tests.mjs --env prod --safe --tag monitor --retries 1
  env:
    ACME_CLIENT_ID: ${{ secrets.ACME_CLIENT_ID }}
    ACME_CLIENT_SECRET: ${{ secrets.ACME_CLIENT_SECRET }}
# #endregion monitor-secrets
