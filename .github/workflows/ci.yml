name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm version:check
      - run: pnpm typecheck
      - run: pnpm build
      # the example's large public specs are not in the repository
      - run: pnpm --filter example run fetch-specs
      - run: pnpm test
      - run: pnpm --filter @specbook/ui exec playwright install --with-deps chromium
      # the one step that has hung on a shared runner (a page that stops answering closes the connection);
      # a second attempt is cheap, and a real failure fails twice. `||` only retries a failure, never a hang,
      # so each attempt has its own limit (the suite takes about 25 s): a stall becomes a failure the second
      # attempt can replace, instead of a run that sits until the job's timeout. The step's own limit is the
      # backstop if `timeout` cannot stop what it started.
      - run: timeout --kill-after=15 300 pnpm test:browser || timeout --kill-after=15 300 pnpm test:browser
        timeout-minutes: 12
      - run: pnpm test:viewer
      - run: pnpm test:slow
      # the packages as npm would serve them, installed outside the workspace
      - run: pnpm test:pack
