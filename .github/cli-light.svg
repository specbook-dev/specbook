<rect x="0.5" y="0.5" width="623" height="435" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<path d="M0.5 40V10.5a10 10 0 0 1 10-10h603a10 10 0 0 1 10 10V40z" fill="#f6f8fa"/>
<circle cx="24" cy="20" r="5.5" fill="#ff5f57"/><circle cx="42" cy="20" r="5.5" fill="#febc2e"/><circle cx="60" cy="20" r="5.5" fill="#28c840"/>
<g class="pass">
<text class="r" x="24" y="64" style="animation:k0 18s linear infinite" xml:space="preserve"><tspan>$ specbook test --env demo</tspan></text>
<text class="r" x="24" y="88" style="animation:k1 18s linear infinite" xml:space="preserve"><tspan class="b">specbook test 0.5.0</tspan><tspan>  </tspan><tspan class="d">env demo  ·  9 tests  ·  main@3f9c2ab</tspan></text>
<text class="r" x="24" y="136" style="animation:k2 18s linear infinite" xml:space="preserve"><tspan>  </tspan><tspan class="green">✓</tspan><tspan> Get a country  </tspan><tspan class="d">POST /  200  11ms</tspan></text>
