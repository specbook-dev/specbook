<text class="r" x="24" y="184" style="animation:k4 18s linear infinite" xml:space="preserve"><tspan>  </tspan><tspan class="green">✓</tspan><tspan> Find pets by status  </tspan><tspan class="d">GET /pet/findByStatus  200  4ms</tspan></text>
<text class="r" x="24" y="208" style="animation:k5 18s linear infinite" xml:space="preserve"><tspan>  </tspan><tspan class="green">✓</tspan><tspan> Get an order  </tspan><tspan class="d">GET /store/order/5001  200  1ms</tspan></text>
<text class="r" x="24" y="232" style="animation:k6 18s linear infinite" xml:space="preserve"><tspan>  </tspan><tspan class="green">✓</tspan><tspan> Place an order  </tspan><tspan class="d">POST /store/order  200  2ms</tspan></text>
<text class="r" x="24" y="256" style="animation:k7 18s linear infinite" xml:space="preserve"><tspan class="d">  …</tspan></text>
<text class="r" x="24" y="304" style="animation:k8 18s linear infinite" xml:space="preserve"><tspan class="b"> Flows      </tspan><tspan> </tspan><tspan class="green">9 passed</tspan><tspan> </tspan><tspan class="d">(9)</tspan></text>
<text class="r" x="24" y="328" style="animation:k9 18s linear infinite" xml:space="preserve"><tspan class="b"> Assertions </tspan><tspan> </tspan><tspan class="green">27 passed</tspan></text>
<text class="r" x="24" y="352" style="animation:k10 18s linear infinite" xml:space="preserve"><tspan class="d">exit 0</tspan></text>
</g>
<g class="fail">
<text class="r" x="24" y="64" style="animation:k11 18s linear infinite" xml:space="preserve"><tspan>$ specbook test --env demo</tspan></text>
<text class="r" x="24" y="88" style="animation:k12 18s linear infinite" xml:space="preserve"><tspan>  </tspan><tspan class="green">✓</tspan><tspan> Find pets by status  </tspan><tspan class="d">GET /pet/findByStatus  200  1ms</tspan></text>
<text class="r" x="24" y="112" style="animation:k13 18s linear infinite" xml:space="preserve"><tspan>  </tspan><tspan class="red">✗</tspan><tspan> Get an order  </tspan><tspan class="d">GET /store/order/5001  200  1ms</tspan></text>
<text class="r" x="24" y="136" style="animation:k14 18s linear infinite" xml:space="preserve"><tspan>  </tspan><tspan class="green">✓</tspan><tspan> Place an order  </tspan><tspan class="d">POST /store/order  200  0ms</tspan></text>
<text class="r" x="24" y="160" style="animation:k15 18s linear infinite" xml:space="preserve"><tspan class="d">  …</tspan></text>
<text class="r" x="24" y="208" style="animation:k16 18s linear infinite" xml:space="preserve"><tspan>    </tspan><tspan class="red">✗</tspan><tspan> still placed</tspan></text>
<text class="r" x="24" y="232" style="animation:k17 18s linear infinite" xml:space="preserve"><tspan>      </tspan><tspan class="green">- Expected</tspan><tspan>  </tspan><tspan class="red">+ Received</tspan></text>
<text class="r" x="24" y="256" style="animation:k18 18s linear infinite" xml:space="preserve"><tspan>      </tspan><tspan class="green">- "placed"</tspan></text>
<text class="r" x="24" y="280" style="animation:k19 18s linear infinite" xml:space="preserve"><tspan>      </tspan><tspan class="red">+ "delivered"</tspan></text>
<text class="r" x="24" y="304" style="animation:k20 18s linear infinite" xml:space="preserve"><tspan>      </tspan><tspan class="d">at requests/petstore/get-order.req.ts:14:16</tspan></text>
<text class="r" x="24" y="352" style="animation:k21 18s linear infinite" xml:space="preserve"><tspan class="b"> Flows      </tspan><tspan> </tspan><tspan class="red">2 failed</tspan><tspan class="d"> | </tspan><tspan class="green">7 passed</tspan><tspan> </tspan><tspan class="d">(9)</tspan></text>
<text class="r" x="24" y="376" style="animation:k22 18s linear infinite" xml:space="preserve"><tspan class="b"> Assertions </tspan><tspan> </tspan><tspan class="red">2 failed</tspan><tspan class="d"> | </tspan><tspan class="green">25 passed</tspan></text>
<text class="r" x="24" y="400" style="animation:k23 18s linear infinite" xml:space="preserve"><tspan class="d">exit 1</tspan></text>
</g>
